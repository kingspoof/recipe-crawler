[crawler]
# REQUIRED: an email or URL that site operators can use to reach you. It is sent in the User-Agent.
contact = ""
user_agent = "RecipeResearchCrawler/0.1"

# Kept in a *.nosync folder so iCloud Drive does not try to sync a multi-GB, constantly changing database.
db_path = "data.nosync/recipes.db"

default_delay = 2.0            # seconds between requests to the same site
max_parallel_domains = 100     # sites crawled at the same time (each one sequentially)
max_recipes_per_site = 80000   # keeps a few huge sites from dominating the dataset
max_recipes_per_region = 200000 # keeps one region (so far: Europe) from dominating; 0 = no limit
target_total = 1000000
timeout = 30
max_attempts = 3
rediscover_after_days = 30     # read the sitemaps again after this many days to find new recipes (0 = never)

[ingredients]
# Ingredient processing with Gemini (`lines` -> `process` -> `map`). Paths are relative to this file.
models = ["gemini-3.5-flash-lite"]  # one lane per key x model; add "gemini-3.1-flash-lite" for more quota
thinking_level = "minimal"
batch_size = 650           # lines per request: ~18.5K output tokens, well below max_output_tokens
max_output_tokens = 32768
max_line_chars = 200       # longer lines are almost always prose, not ingredients: skipped
max_attempts = 2           # a line the model leaves out this often is marked failed (status -1)
rpd = 500                  # requests per day per key x model (free tier, check AI Studio); 0 = no own limit
rpm = 14                   # our own pace per lane (the free tier allows 15)
in_flight = 200            # requests at the same time per lane (~1 min per request)
stagger = 5                # seconds between the first request of each lane
usage_log = "data.nosync/gemini_usage.jsonl"
keys_file = "gemini_keys.txt"  # one key per line, ONE KEY PER PROJECT (keys of a project share the quota)

# ---------------------------------------------------------------------------------------------
# Seed sites. Every site below was tested with `recipe-crawler probe` on 2026-10-28 and returned
# schema.org recipes. `country` = cuisine the site mainly covers (ISO code), `region` = for balancing.
#
# Optional per-site keys:
#   sitemaps        = ["https://..."]   explicit sitemap URLs (default: from robots.txt)
#   sitemap_pattern = "regex"           only follow child sitemaps matching this
#   url_pattern     = "regex"           only queue page URLs matching this
#   follow_links    = true              for sites without recipe sitemaps (needs url_pattern)
#   follow_pattern  = "regex"           listing pages to follow in follow_links mode
#   start_urls      = ["https://..."]   where follow_links mode starts (default: homepage)
#   delay, max_recipes, enabled
#
# Excluded after probing (blocked bots with 402/403, no JSON-LD, or disallowed in robots.txt):
#   allrecipes.com, seriouseats.com, justonecookbook.com, tarladalal.com, ah.nl, chinasichuanfood.com,
#   taste.com.au, 196flavors.com, cucchiaio.it, przepisy.pl, maangchi.com, masakapahariini.com,
#   atyabtabkha.com, food24.com, kiwilimon.com (client-side rendered), yemek.com (no sitemap),
#   sarashpazpapion.com, oktayustam.com, meishij.net, xiangha.com, haemukja.com, sanjeevkapoor.com, masala.tv,
#   foody.co.il, smulweb.nl, deliciousmagazine.co.uk, bestrecipes.com.au, rotinrice.com, recettes.qc.ca.
# Excluded for bad structured data (placeholder or incomplete ingredients): nishamadhulika.com,
#   ranveerbrar.com, christinesrecipes.com, trinesmatblogg.no, 24kitchen.pt, kfoods.com, kuchynalidla.sk,
#   24kitchen.rs, chelsea.co.nz, recettes-haitiennes.com, cocinafacil.com.mx.
# Gap-filling round (2026-10-28, candidates from Web Data Commons Recipe domain stats), also excluded:
#   403 to bots: toriavey.com, silkroadrecipes.com, odlums.ie, canadianliving.com, choumicha.com.
#   Unreachable from here (connection timeout / DNS; may be geo-blocked, retry from another network):
#   nami-nami.ee, povar.ru, imaot.co.il, bishulim.co.il, 10dakot.co.il, gotovim.uz, redmag.ir, goyda.ir,
#   turmericsaffron.com, mypersiankitchen.com, nawalnasrallah.com, myresipi.com, yummy.co.id, recetasboricuas.com.
#   No Recipe JSON-LD: kaluhiskitchen.com, zimbokitchen.com, xawaash.com, sisijemimah.com, 9jafoodie.com,
#   noobcook.com, themeatmen.sg, rasa.my, caribbeanpot.com, laylita.com, boliviabella.com, georgianrecipes.net,
#   chefindisguise.com, bongeats.com, zira.uz, burmesefoodlovers.com, krua.co, thehongkongcookery.com.
#   Disallowed in robots.txt: arabtabkh.com.
